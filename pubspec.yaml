name: expense_tracker
description: "Offline privacy-focused expense tracker"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^8.1.0
  intl: ^0.20.2
  flutter_onboarding_slider: ^1.0.11

  # State Management (StateNotifier supported)
  flutter_riverpod: ^2.6.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure Local Storage
  flutter_secure_storage: ^9.2.4

  # Image Handling
  image_picker: ^1.2.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utilities
  uuid: ^4.5.3
  fl_chart: ^1.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

  # App Assets
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/expense_light_logo.png"

flutter_native_splash:
  color: "#00885d"
  image: assets/splash_logo.png

  color_dark: "#121212"
  image_dark: assets/light_splash.png

  fullscreen: false

  android_12:
    color: "#00885d"
    image: assets/splash_logo.png
    icon_background_color: "#00885d"

    image_dark: assets/light_splash.png
    icon_background_color_dark: "#121212"

    fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/onboard_image.webp
    - assets/expense_light_logo.png
    - assets/light_splash.png
    - assets/splash_logo.png