name: expense_tracker
description: "TrackKar — offline, privacy-focused expense tracker"

publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^1.2.0

  # Image handling
  image_picker: ^1.2.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # File picker & open
  file_picker: ^8.1.7
  open_filex: ^4.7.0

  # Storage permission (Android 6-12)
  permission_handler: ^11.3.1
  flutter_file_dialog: ^3.0.3
  device_info_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/expense_light_logo.png"

flutter_native_splash:
  color: "#00885d"
  image: assets/final_logo.png
  color_dark: "#0F172A"
  image_dark: assets/final_logo.png
  fullscreen: false
  android_12:
    color: "#00885d"
    image: assets/final_logo.png
    color_dark: "#0F172A"
    image_dark: assets/final_logo.png
    fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/onboard_image.webp
    - assets/expense_light_logo.png
    - assets/final_logo.png